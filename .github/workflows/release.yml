# Publishes to npmjs.com with Trusted Publishing (OIDC).
# No NPM_TOKEN and no 90-day granular access token.
#
# One-time setup (package owner, with 2FA):
#   npmjs.com → Package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: htool
#     Repository:           signalk-polar-performance-plugin
#     Workflow filename:    release.yml
#     Environment:          (leave blank; this workflow does not use one)
#     Allowed action:       npm publish
#   or from a logged-in machine:
#     npx -y npm@latest trust github signalk-polar-performance-plugin \
#       --file release.yml \
#       --repository htool/signalk-polar-performance-plugin \
#       --allow-publish
# Docs: https://docs.npmjs.com/trusted-publishers/

name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.5.1+, required for OIDC trusted publishing.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@latest
      - name: Remove setup-node auth token placeholder
        # registry-url writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}.
        # An empty placeholder makes npm skip OIDC and fail with ENEEDAUTH.
        run: |
          NPMRC_PATH="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC_PATH" ]; then
            sed -i '/_authToken/d' "$NPMRC_PATH"
          fi
      - run: npm ci
      - name: Dry run validation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish != true }}
        run: echo "Manual workflow validation only; npm publish skipped."
      - name: Publish to npm
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish == true }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$tag" == *beta* ]]; then
            npm publish --access public --tag beta
          else
            npm publish --access public
          fi
