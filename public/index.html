<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polar Performance</title>

  <!-- Dynamically inject the SignalK admin UI stylesheet.
       Reads the Vite manifest (SK server >= 2.27.0); falls back to scraping
       the admin root page on older servers. -->
  <script>
    (async () => {
      const appendStylesheet = (href) => {
        const el = document.createElement('link')
        el.rel  = 'stylesheet'
        el.href = href
        document.head.appendChild(el)
      }
      try {
        const res = await fetch('/admin/.vite/manifest.json')
        if (res.ok) {
          const manifest = await res.json()
          let found = false
          for (const entry of Object.values(manifest)) {
            if (!entry.isEntry) continue
            for (const css of entry.css ?? []) {
              appendStylesheet('/admin/' + css)
              found = true
            }
          }
          if (found) return
        }
      } catch (e) { /* fall through */ }
      try {
        const res  = await fetch('/')
        const html = await res.text()
        const doc  = new DOMParser().parseFromString(html, 'text/html')
        const link = doc.querySelector('link[rel="stylesheet"]')
        if (link) appendStylesheet(new URL(link.getAttribute('href'), res.url).href)
      } catch (e) {
        console.warn('[polar] Could not load SignalK admin stylesheet:', e)
      }
    })()
  </script>

  <link rel="stylesheet" href="main.css">
</head>
<body class="app header-fixed sidebar-fixed aside-menu-fixed aside-menu-hidden">

        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
    <span id="message" class="text-danger small ms-auto me-3"></span>
  </header>

  <div class="app-body">

    <div class="sidebar">
      <nav class="sidebar-nav">

          <li class="nav-item"><a class="nav-link" href="#" data-page="inputs">Inputs</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-page="settings">Polar</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-page="performance">Performance</a></li>

        </ul>
      </nav>

    <main class="main">
      <div class="container-fluid pt-3">

          <div class="card-header fw-bold text-uppercase" id="card-title">Overview</div>
          <div class="card-body" id="card-body"></div>

      </div>

  </div>

  <!-- polar-canvas.js sets window.PolarCanvas (regular script, executes before the module) -->

  <script type="module" src="app.js"></script>

</body>
</html>
